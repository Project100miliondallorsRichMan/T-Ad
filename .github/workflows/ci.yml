name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check syntax & imports
        run: |
          python -m py_compile app.py llm.py factcheck.py utils.py ui.py
          python -c "import llm, factcheck, utils, ui"
      - name: Run unit tests
        run: |
          python tests/test_factcheck.py
          python tests/test_app_deploy.py
          python tests/test_ui.py
